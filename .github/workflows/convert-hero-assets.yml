name: Convertir les héros WebP en PNG Android

on:
  push:
    branches: [ v2-godot-3d ]
    paths:
      - '.github/workflows/convert-hero-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  conversion:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche 3D
        uses: actions/checkout@v6
        with:
          ref: v2-godot-3d
          fetch-depth: 0

      - name: Installer Pillow
        run: python3 -m pip install --quiet pillow

      - name: Convertir et verrouiller les imports Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          root = Path('godot/assets/heroes')
          for source in sorted(root.glob('*.webp')):
              image = Image.open(source).convert('RGBA')
              image = image.resize((888, 444), Image.Resampling.LANCZOS)
              destination = source.with_suffix('.png')
              image.save(destination, 'PNG', optimize=True, compress_level=9)
              alpha = image.getchannel('A').getextrema()
              if alpha != (0, 255):
                  raise RuntimeError(f'Alpha incorrect pour {destination}: {alpha}')

              resource_path = f'res://assets/heroes/{destination.name}'
              path_hash = hashlib.md5(resource_path.encode('utf-8')).hexdigest()
              uid = hashlib.sha256(resource_path.encode('utf-8')).hexdigest()[:13]
              imported_path = f'res://.godot/imported/{destination.name}-{path_hash}.ctex'
              import_text = f'''[remap]

          importer="texture"
          type="CompressedTexture2D"
          uid="uid://{uid}"
          path="{imported_path}"
          metadata={{
          "vram_texture": false
          }}

          [deps]

          source_file="{resource_path}"
          dest_files=["{imported_path}"]

          [params]

          compress/mode=0
          compress/high_quality=false
          compress/lossy_quality=0.7
          compress/uastc_level=0
          compress/rdo_quality_loss=0.0
          compress/hdr_compression=1
          compress/normal_map=0
          compress/channel_pack=0
          mipmaps/generate=true
          mipmaps/limit=-1
          roughness/mode=0
          roughness/src_normal=""
          process/channel_remap/red=0
          process/channel_remap/green=1
          process/channel_remap/blue=2
          process/channel_remap/alpha=3
          process/fix_alpha_border=true
          process/premult_alpha=false
          process/normal_map_invert_y=false
          process/hdr_as_srgb=false
          process/hdr_clamp_exposure=false
          process/size_limit=0
          detect_3d/compress_to=0
          '''
              destination.with_suffix('.png.import').write_text(import_text, encoding='utf-8')
              print(f'{source.name} -> {destination.name}, import lossless Android')

          factory = Path('godot/scripts/hero_factory.gd')
          text = factory.read_text(encoding='utf-8').replace('.webp"', '.png"')
          factory.write_text(text, encoding='utf-8')
          PY

      - name: Commiter les PNG et leurs imports lossless
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CHK Pirate Warrior CI"
          git config user.email "actions@github.com"
          git add godot/assets/heroes/*.png godot/assets/heroes/*.png.import godot/scripts/hero_factory.gd
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter."
            exit 0
          fi
          git commit -m "fix(assets): forcer les héros en textures lossless Android"
          git push origin HEAD:v2-godot-3d
