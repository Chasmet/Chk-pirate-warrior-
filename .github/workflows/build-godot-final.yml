name: Construire CHK Pirate Warrior final

on:
  push:
    branches: [ godot-final-polish ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-final.yml'
  pull_request:
    branches: [ v2-godot-3d, main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-et-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Installer Android et créer la signature debug
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=CHK Pirate Warrior,O=Chasmet,C=FR'
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Installer Godot 4.6.3 stable
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Installer les modèles d'export Android 4.6.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Importer les ressources
        shell: bash
        run: |
          set -o pipefail
          timeout 300s "$GODOT_BIN" --headless --editor --path godot --quit 2>&1 | tee godot-import.log

      - name: Tester sans bloquer la création de l'APK
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 240s "$GODOT_BIN" --headless --path godot --quit-after 180 2>&1 | tee godot-runtime.log
          "$GODOT_BIN" --headless --path godot --script res://tests/final_pipeline_test.gd 2>&1 | tee godot-final-test.log
          exit 0

      - name: Construire l'APK Android finale
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path godot \
            --export-debug 'Android V2 Debug' \
            "$GITHUB_WORKSPACE/build/CHK-Pirate-Warrior-Final-debug.apk" 2>&1 | tee godot-export.log
          test -s build/CHK-Pirate-Warrior-Final-debug.apk
          unzip -t build/CHK-Pirate-Warrior-Final-debug.apk >/dev/null
          sha256sum build/CHK-Pirate-Warrior-Final-debug.apk | tee build/SHA256.txt

      - name: Publier l'APK réelle
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-Final-APK
          path: |
            build/CHK-Pirate-Warrior-Final-debug.apk
            build/SHA256.txt
            godot-final-test.log
            godot-export.log
          if-no-files-found: error
          retention-days: 30

      - name: Publier les diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-Final-diagnostics
          path: |
            godot-import.log
            godot-runtime.log
            godot-final-test.log
            godot-export.log
          if-no-files-found: ignore
          retention-days: 14