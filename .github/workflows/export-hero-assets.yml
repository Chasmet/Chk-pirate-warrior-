name: Exporter les références héros

on:
  push:
    branches: [ v2-godot-3d ]
    paths:
      - '.github/workflows/export-hero-assets.yml'
      - 'godot/assets/heroes/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/export-hero-assets.yml'
      - 'godot/assets/heroes/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publier les images originales
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Hero-Source-Assets
          path: godot/assets/heroes/*.webp
          if-no-files-found: error
          retention-days: 7
