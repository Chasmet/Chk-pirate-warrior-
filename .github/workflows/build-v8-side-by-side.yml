name: Construire CHK Pirate Warrior V8 Test Parallèle

on:
  push:
    branches: [ agent/godot-real-assets-v3 ]
    paths:
      - 'godot/export_presets.cfg'
      - 'godot/scripts/**'
      - 'godot/tests/v8_gameplay_stability_test.gd'
      - '.github/workflows/build-v8-side-by-side.yml'
  pull_request:
    branches: [ godot-final-polish ]
    paths:
      - 'godot/export_presets.cfg'
      - 'godot/scripts/**'
      - 'godot/tests/v8_gameplay_stability_test.gd'
      - '.github/workflows/build-v8-side-by-side.yml'
  workflow_dispatch:

concurrency:
  group: chk-v8-test-parallele-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-parallele:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Récupérer le projet complet
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Vérifier le preset parallèle
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'name="Android V8 Test Parallèle"' godot/export_presets.cfg
          grep -q 'package/unique_name="fr.chk.piratewarrior.v8test"' godot/export_presets.cfg
          test -s godot/tests/v8_gameplay_stability_test.gd

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Installer Android et une signature debug
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=CHK Pirate Warrior V8 Test,O=Chasmet,C=FR'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Installer Godot 4.6.3 stable
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Installer les modèles d’export Android
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Générer la banque audio conservée
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check numpy
          rm -rf godot/assets/audio_v7
          python3 tools/generate_audio_v7.py --output godot/assets/audio_v7
          test "$(du -sb godot/assets/audio_v7 | cut -f1)" -ge 95000000

      - name: Importer et tester la V8
        shell: bash
        run: |
          set -o pipefail
          timeout 600s "$GODOT_BIN" --headless --editor --path godot --quit 2>&1 | tee godot-import-parallele.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load|ERROR:' godot-import-parallele.log
          "$GODOT_BIN" --headless --path godot --script res://tests/v8_gameplay_stability_test.gd 2>&1 | tee godot-v8-parallele-test.log
          grep -q 'CHK_V8_GAMEPLAY_STABILITY_READY' godot-v8-parallele-test.log
          grep -q 'CHK_V8_SELECTED_HERO_AT_HELM_READY' godot-v8-parallele-test.log
          grep -q 'CHK_V8_ANDROID_PERFORMANCE_READY' godot-v8-parallele-test.log

      - name: Construire l’APK installable à côté de la V7
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path godot \
            --export-debug 'Android V8 Test Parallèle' \
            "$GITHUB_WORKSPACE/build/CHK-Pirate-Warrior-V8-Test-Parallele-debug.apk" 2>&1 | tee godot-export-parallele.log
          APK="build/CHK-Pirate-Warrior-V8-Test-Parallele-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c%s "$APK")" -ge 100000000
          sha256sum "$APK" | tee build/SHA256-PARALLELE.txt
          stat -c 'APK_BYTES=%s' "$APK" | tee build/APK_SIZE-PARALLELE.txt

      - name: Publier l’APK parallèle
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-V8-Test-Parallele-APK
          path: |
            build/CHK-Pirate-Warrior-V8-Test-Parallele-debug.apk
            build/SHA256-PARALLELE.txt
            build/APK_SIZE-PARALLELE.txt
            godot-v8-parallele-test.log
            godot-export-parallele.log
          if-no-files-found: error
          retention-days: 90
