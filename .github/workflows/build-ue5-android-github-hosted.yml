name: Construire APK Unreal Engine 5.8 sur GitHub

on:
  push:
    branches:
      - ue5-github-apk-build
    paths:
      - "unreal/**"
      - ".github/workflows/build-ue5-android-github-hosted.yml"
  pull_request:
    branches:
      - ue5-migration
    paths:
      - "unreal/**"
      - ".github/workflows/build-ue5-android-github-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-5.8
  PROJECT_DIR: ${{ github.workspace }}/unreal/CHKPirateWarrior
  OUTPUT_DIR: ${{ github.workspace }}/unreal-build/Android

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Libérer de l'espace disque
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/powershell || true
          docker system prune --all --force || true
          df -h /

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Préparer Android SDK 35 et NDK r27c
        uses: android-actions/setup-android@v3

      - name: Installer la chaîne Android Unreal 5.8
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - name: Authentifier le registre Epic Games
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.UE_GHCR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker manifest inspect "$UE_IMAGE" > unreal-5.8-manifest.json
          test -s unreal-5.8-manifest.json

      - name: Télécharger Unreal Engine 5.8
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$UE_IMAGE"
          docker image inspect "$UE_IMAGE" --format '{{.Id}} {{.Size}}'
          df -h /

      - name: Construire et empaqueter l'APK Android
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUTPUT_DIR"
          chmod -R a+rwX "$PROJECT_DIR" "$OUTPUT_DIR"

          docker run --rm \
            --shm-size=8g \
            --entrypoint /bin/bash \
            -v "$PROJECT_DIR:/project" \
            -v "$OUTPUT_DIR:/output" \
            -v "$ANDROID_SDK_ROOT:$ANDROID_SDK_ROOT" \
            -v "$JAVA_HOME:$JAVA_HOME:ro" \
            -e HOME=/tmp/ue-home \
            -e JAVA_HOME="$JAVA_HOME" \
            -e ANDROID_HOME="$ANDROID_SDK_ROOT" \
            -e ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -e NDKROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            -e NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            "$UE_IMAGE" -lc '
              set -euxo pipefail
              export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
              mkdir -p "$HOME"
              java -version
              test -x /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh
              sed -i "s/^ForDistribution=True/ForDistribution=False/" /project/Config/DefaultGame.ini
              /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh \
                BuildCookRun \
                -project=/project/CHKPirateWarrior.uproject \
                -noP4 \
                -unattended \
                -utf8output \
                -platform=Android \
                -cookflavor=ASTC \
                -clientconfig=Development \
                -build \
                -cook \
                -stage \
                -package \
                -pak \
                -iostore \
                -compressed \
                -archive \
                -archivedirectory=/output \
                2>&1 | tee /output/BuildCookRun.log
            '

      - name: Vérifier l'APK produite
        shell: bash
        run: |
          set -euxo pipefail
          find "$OUTPUT_DIR" -type f -maxdepth 8 -print
          APK_PATH="$(find "$OUTPUT_DIR" -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          sha256sum "$APK_PATH" | tee "$OUTPUT_DIR/SHA256.txt"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Publier l'APK Android réelle
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-UE5-Android-APK
          path: |
            ${{ env.OUTPUT_DIR }}/**/*.apk
            ${{ env.OUTPUT_DIR }}/SHA256.txt
            ${{ env.OUTPUT_DIR }}/BuildCookRun.log
          if-no-files-found: error
          retention-days: 30

      - name: Publier les diagnostics en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CHK-UE5-Android-build-diagnostics
          path: |
            unreal-5.8-manifest.json
            ${{ env.OUTPUT_DIR }}/BuildCookRun.log
            ${{ env.OUTPUT_DIR }}/**/*.log
          if-no-files-found: ignore
          retention-days: 14
