name: Construire CHK Pirate Warrior V3.5

on:
  push:
    branches: [ agent/godot-real-assets-v3 ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-boss25d.yml'
  pull_request:
    branches: [ godot-final-polish ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-boss25d.yml'
  workflow_dispatch:

concurrency:
  group: chk-godot-v35-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation-et-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Récupérer le véritable projet Godot
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Auditer les rosters 2.5D embarqués
        shell: bash
        run: |
          set -euxo pipefail
          test -s godot/assets/boss25d/data/island_0_boss_data.gd
          for zone in 0 1 2 3 4 5; do
            source="godot/assets/roster25d/compact/island_${zone}.b64"
            test -s "$source"
            test "$(stat -c%s "$source")" -gt 1000
          done
          test -s godot/scripts/enemy_25d_asset_bank.gd
          test -s godot/scripts/roster_25d_director.gd
          grep -q 'Roster25DDirector' godot/project.godot
          grep -q 'CombatVarietyDirector' godot/project.godot
          grep -Fq 'include_filter="*.b64"' godot/export_presets.cfg

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Installer Android et la signature debug
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=CHK Pirate Warrior,O=Chasmet,C=FR'
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Installer Godot 4.6.3 stable
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Installer les modèles d’export Android
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Importer les ressources et vérifier tous les scripts
        shell: bash
        run: |
          set -o pipefail
          timeout 300s "$GODOT_BIN" --headless --editor --path godot --quit 2>&1 | tee godot-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load|ERROR:' godot-import.log

      - name: Tester le roster V3 et le bateau
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path godot --script res://tests/v3_roster_25d_test.gd 2>&1 | tee godot-v3-roster-test.log
          grep -q 'V3 ROSTER 2.5D ET BATEAU RÉUSSI' godot-v3-roster-test.log
          "$GODOT_BIN" --headless --path godot --script res://tests/boss_25d_visual_test.gd 2>&1 | tee godot-boss25d-test.log
          grep -q 'BRAKOR 2.5D DANS MONDE 3D RÉUSSI' godot-boss25d-test.log

      - name: Tester caméra, pouvoirs, navigation et progression
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path godot --script res://tests/camera_regression_test.gd 2>&1 | tee godot-camera-test.log
          grep -q 'CAMERA REGRESSION TEST RÉUSSI' godot-camera-test.log
          "$GODOT_BIN" --headless --path godot --script res://tests/final_pipeline_test.gd 2>&1 | tee godot-final-test.log
          grep -q 'PIPELINE FINAL RÉUSSI' godot-final-test.log

      - name: Construire l’APK Android V3.5
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path godot \
            --export-debug 'Android V2 Debug' \
            "$GITHUB_WORKSPACE/build/CHK-Pirate-Warrior-V3.5-debug.apk" 2>&1 | tee godot-export.log
          test -s build/CHK-Pirate-Warrior-V3.5-debug.apk
          unzip -t build/CHK-Pirate-Warrior-V3.5-debug.apk >/dev/null
          sha256sum build/CHK-Pirate-Warrior-V3.5-debug.apk | tee build/SHA256.txt
          stat -c 'APK_BYTES=%s' build/CHK-Pirate-Warrior-V3.5-debug.apk | tee build/APK_SIZE.txt

      - name: Publier l’APK V3.5 testée
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-V3.5-APK
          path: |
            build/CHK-Pirate-Warrior-V3.5-debug.apk
            build/SHA256.txt
            build/APK_SIZE.txt
            godot-v3-roster-test.log
            godot-boss25d-test.log
            godot-camera-test.log
            godot-final-test.log
            godot-export.log
          if-no-files-found: error
          retention-days: 30

      - name: Publier les diagnostics V3.5
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Pirate-Warrior-V3.5-diagnostics
          path: |
            godot-import.log
            godot-v3-roster-test.log
            godot-boss25d-test.log
            godot-camera-test.log
            godot-final-test.log
            godot-export.log
          if-no-files-found: ignore
          retention-days: 14
